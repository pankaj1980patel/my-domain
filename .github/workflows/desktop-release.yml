# Builds the installable apps: macOS (.dmg + .app.tar.gz), Linux (AppImage +
# .deb), Windows (.msi + NSIS .exe) and the Android APK.
#
# - Run by hand (Actions > App release > Run workflow): the files are the
#   run's downloadable artifacts. Nothing is released.
# - Push a tag vX.Y.Z: the same, plus a DRAFT GitHub Release with every file
#   attached. Publish the draft by hand once it looks right.
#
# Nothing is code-signed yet. With the TAURI_SIGNING_PRIVATE_KEY secrets the
# desktop update files are signed and latest.json is attached for the app's
# automatic updates (docs/RELEASING.md); without them that's skipped. See
# docs/release.md for what each file is and how to open the unsigned apps.
name: App release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# One release run per ref at a time; a newer run of the same ref waits.
concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The app version comes from tauri.conf.json. On a tag push the tag must be
  # v<that version>, and the desktop Cargo.toml and the Android versionName
  # must say the same, so the files on the release are what the tag claims.
  version:
    name: version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read the app version
        run: |
          set -euo pipefail
          conf=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n1)
          android=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' apps/android/app/build.gradle.kts | head -n1)
          echo "tauri.conf.json:            $conf"
          echo "src-tauri/Cargo.toml:       $cargo"
          echo "android versionName:        $android"
          echo "version=$conf" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            fail=0
            if [ "$tag" != "v$conf" ]; then
              echo "::error::Tag $tag does not match the app version $conf in apps/desktop/src-tauri/tauri.conf.json (expected tag v$conf). Bump the version (see docs/release.md), commit, and tag that commit."
              fail=1
            fi
            if [ "$cargo" != "$conf" ]; then
              echo "::error::apps/desktop/src-tauri/Cargo.toml version $cargo != tauri.conf.json version $conf."
              fail=1
            fi
            if [ "$android" != "$conf" ]; then
              echo "::error::apps/android/app/build.gradle.kts versionName $android != tauri.conf.json version $conf."
              fail=1
            fi
            exit $fail
          fi

  desktop:
    name: desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            bundles: app,dmg
            arch: aarch64
          # Intel Macs: built natively on an Intel runner (Homebrew's
          # OpenSSL there is x86_64), so the updater has darwin-x86_64.
          - name: macos-x86_64
            os: macos-15-intel
            bundles: app,dmg
            arch: x86_64
          - name: linux-x86_64
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: windows-x86_64
            os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The Ubuntu image ships toolchains this build never uses.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      # Linux: the same libraries CI compiles against (WebKitGTK 4.1, GTK 3,
      # appindicator, ALSA, D-Bus, ...), plus what the AppImage bundler uses.
      # ubuntu-22.04 rather than latest: an AppImage only runs on systems with
      # a glibc at least as new as the one it was built against.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends file patchelf libfuse2

      # macOS: the FCM receiver needs OpenSSL (fcm_receiver_rs -> ece ->
      # openssl). Link Homebrew's static libraries so the .app doesn't depend
      # on /opt/homebrew/opt/openssl@3 being installed on the user's Mac.
      - if: runner.os == 'macOS'
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      # Windows: the same OpenSSL as CI's Windows job: vcpkg's static-md
      # triplet (static libs, dynamic CRT), found through VCPKG_ROOT.
      - if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows-static-md
      - if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # apps/desktop holds the Tauri CLI; apps/desktop/ui the frontend that
      # tauri.conf.json's beforeBuildCommand (npm --prefix ui run build)
      # builds into ui/dist (frontendDist).
      - run: npm ci
        working-directory: apps/desktop
      - run: npm ci
        working-directory: apps/desktop/ui

      # Automatic updates (docs/RELEASING.md): with the TAURI_SIGNING_PRIVATE_KEY
      # secret and a public key (tauri.conf.json's plugins > updater > pubkey,
      # or the repository variable TAURI_UPDATER_PUBKEY, which wins), the
      # bundler signs the update files (.sig next to each) and the app checks
      # for updates. Without them the build still works: no update files,
      # and the app says it can't update itself.
      - name: Updater signing setup
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          conf=apps/desktop/src-tauri/tauri.conf.json
          pub="${UPDATER_PUBKEY:-$(jq -r '.plugins.updater.pubkey // ""' "$conf")}"
          extra="$RUNNER_TEMP/updater-config.json"
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ] || [ -z "$pub" ] || [ "$pub" = "REPLACE_WITH_UPDATER_PUBLIC_KEY" ]; then
            echo "::warning::Updater signing skipped: set the TAURI_SIGNING_PRIVATE_KEY secret and the public key (see docs/RELEASING.md). This build won't update itself."
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$extra"
            echo "UPDATER_SIGNED=0" >> "$GITHUB_ENV"
          else
            jq -n --arg k "$pub" '{plugins:{updater:{pubkey:$k}}}' > "$extra"
            echo "UPDATER_SIGNED=1" >> "$GITHUB_ENV"
          fi
          echo "UPDATER_CONFIG=$extra" >> "$GITHUB_ENV"

      # The workspace's shared target/ dir: bundles land in
      # <repo>/target/release/bundle/<kind>/.
      - name: Build and bundle
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }} --config "$UPDATER_CONFIG"

      # Copy the files out under names that say version + platform, each
      # update file with its .sig when signed (scripts/updater-manifest.py
      # expects these names).
      - name: Collect bundles (macOS)
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          b=target/release/bundle
          out="dist/my-domain_${VERSION}_macos_${ARCH}"
          cp "$b"/dmg/*.dmg "$out.dmg"
          if [ "$UPDATER_SIGNED" = 1 ]; then
            cp "$b"/macos/my-domain.app.tar.gz "$out.app.tar.gz"
            cp "$b"/macos/my-domain.app.tar.gz.sig "$out.app.tar.gz.sig"
          else
            tar -czf "$out.app.tar.gz" -C "$b/macos" my-domain.app
          fi
      - name: Collect bundles (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          b=target/release/bundle
          out="dist/my-domain_${VERSION}"
          cp "$b"/deb/*.deb "${out}_linux_amd64.deb"
          cp "$b"/appimage/*.AppImage "${out}_linux_x86_64.AppImage"
          if [ "$UPDATER_SIGNED" = 1 ]; then
            cp "$b"/appimage/*.AppImage.sig "${out}_linux_x86_64.AppImage.sig"
            for s in "$b"/deb/*.deb.sig; do [ -f "$s" ] && cp "$s" "${out}_linux_amd64.deb.sig"; done
          fi
      - name: Collect bundles (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          b=target/release/bundle
          out="dist/my-domain_${VERSION}"
          cp "$b"/msi/*.msi "${out}_windows_x64.msi"
          cp "$b"/nsis/*.exe "${out}_windows_x64-setup.exe"
          if [ "$UPDATER_SIGNED" = 1 ]; then
            cp "$b"/msi/*.msi.sig "${out}_windows_x64.msi.sig"
            cp "$b"/nsis/*.exe.sig "${out}_windows_x64-setup.exe.sig"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: my-domain-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Built exactly like CI's android job: a debug APK, signed with the
  # Android debug key. A release keystore is a later step.
  android:
    name: android (debug APK)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the NDK version the app pins
        run: |
          NDK=$(grep -oP 'ndkVersion = "\K[^"]+' apps/android/app/build.gradle.kts)
          sdkmanager "ndk;$NDK"
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug
      - run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/my-domain_${VERSION}_android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: my-domain-${{ needs.version.outputs.version }}-android
          path: dist/*
          if-no-files-found: error

  # Tag pushes only: one draft release with every file attached.
  release:
    name: draft GitHub release
    if: github.ref_type == 'tag'
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # latest.json for the app's updater, from the signed files (none
      # signed: none written, and the release goes out without updates).
      # Its "What's new" is the annotated tag's message.
      - name: Update manifest (latest.json)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          : > "$RUNNER_TEMP/notes.txt"
          # Only an annotated tag has its own message (a lightweight one
          # would give the commit's).
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > "$RUNNER_TEMP/notes.txt"
          fi
          python3 scripts/updater-manifest.py dist "$VERSION" "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "$RUNNER_TEMP/notes.txt"
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: my-domain ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            my-domain ${{ needs.version.outputs.version }}.

            These builds are not code-signed. See docs/release.md for how to
            open them on macOS and Windows. The Android APK is signed with
            the debug key. Installed desktop apps update themselves once
            this release is published (when latest.json is attached).
