# Builds the registry server's x86_64 Linux binary. apps/server/deploy.sh
# (BIN_SOURCE=gh) downloads the artifact from the latest successful run.
name: Server release (amd64)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/server/**", "Cargo.toml", "Cargo.lock", ".github/workflows/server-release.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: my-domain-server

jobs:
  build:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # The server is one member of the workspace: build only that package.
      - name: Build release binary
        run: cargo build --release --locked -p ${{ env.BIN_NAME }} --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-amd64
          path: target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}
          if-no-files-found: error

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}
