# Runs on every push and PR. A PR is mergeable only when all jobs are green.
# See learnings/08-testing.md and learnings/12-build-ci-release.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI only (local builds stay friendly).
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # --no-tests=pass: crates without tests yet must not fail the job.
      - run: cargo nextest run --workspace --locked --no-tests=pass
      # nextest does not run doctests; run them separately.
      - run: cargo test --workspace --locked --doc

  desktop-ui:
    name: desktop UI (typecheck + build, bindings current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - run: npm ci
        working-directory: apps/desktop/ui
      - run: npm run build
        working-directory: apps/desktop/ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      # The TypeScript bindings must match the Rust commands.
      - run: cargo test -p my-domain --locked export_bindings
      - run: git diff --exit-code apps/desktop/ui/src/bindings.ts

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for "tools", which the SDK no longer has.
          packages: platform-tools
      - name: Install the NDK version the app pins
        run: |
          NDK=$(grep -oP 'ndkVersion = "\K[^"]+' apps/android/app/build.gradle.kts)
          sdkmanager "ndk;$NDK"
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
