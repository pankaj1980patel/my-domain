# System libraries needed to compile the whole workspace on Ubuntu. The desktop
# crate links WebKitGTK (Tauri) and ALSA (pulled in by the FCM receiver), so
# even `cargo clippy --workspace` needs them. Mirrors apps/desktop/Dockerfile.linux-build.
name: linux-deps
description: Install Tauri/GTK/ALSA build dependencies
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libxdo-dev libssl-dev libasound2-dev \
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
