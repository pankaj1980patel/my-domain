[package]
name = "mdcore"
version = "0.1.0"
edition = "2021"
description = "my-domain shared core: crypto, wire protocol, discovery, transports, and the service/channel-mux framework. Pure Rust, no platform deps."

[lib]
name = "mdcore"

[features]
default = ["webrtc"]
# Heavy, optional services. Excluded from low-power builds so their codec/media
# deps are not pulled in.
av = []
remote-control = []
# WebRTC data-channel rung (str0m, pure-Rust sans-IO with the RustCrypto DTLS
# backend — no tokio, no C/C++). Gated so minimal builds can drop it.
webrtc = ["dep:str0m"]

[dependencies]
# TypeScript types for the desktop UI (tauri-specta); only the desktop enables it.
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
socket2 = { version = "0.5", features = ["all"] }
# UPnP-IGD: ask the home router to forward our QUIC port (sync client).
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
# mDNS / DNS-SD: standard LAN discovery (Bonjour / NSD / Avahi compatible).
mdns-sd = "0.21"
# NAT-PMP / PCP port mapping (routers without UPnP).
crab_nat = "0.8"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# Synced folders compare names in NFC (a Mac's disk takes "é" as one
# character or as "e" + accent for the same name).
unicode-normalization = "=0.1.26"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
# "tls" pulls in the rustls backend + bundled webpki roots so HTTPS works (e.g.
# an ngrok https tunnel). Matches the android client's stricter feature set.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# "Download on <device>" (`features::link_fetch`): links parsed the way
# browsers do (international names to punycode, odd IPv4 forms), and shown
# back in their own script. Both already come with ureq.
url = "2.5"
idna = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Server TLS trusts the bundled roots plus the OS store (company HTTPS
# proxies install their CA there). See src/tls.rs.
webpki-roots = "0.26"
rustls-native-certs = "0.8"
# Lightweight, sans-IO WebRTC for the final connect rung. RustCrypto backend
# only (no aws-lc/openssl) so it cross-compiles cleanly (incl. android NDK).
str0m = { version = "0.21", default-features = false, features = ["rust-crypto"], optional = true }

# Opus audio (`features::opus_audio`): libopus itself (BSD-3-Clause),
# bundled and built with cmake by opusic-sys, statically linked on every
# platform (Android's NDK toolchain included). The one C dependency the core
# takes, approved for audio quality: 48 kHz at a tenth of ADPCM's bytes.
opus = "0.4"

[dev-dependencies]
md-testkit = { workspace = true }

[lints]
workspace = true
