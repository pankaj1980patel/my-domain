<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="my-domain">
  <!-- my-domain: a black hole with a white halo, in a diamond. -->
  <defs>
    <clipPath id="diamond">
      <rect x="12" y="12" width="40" height="40" rx="8" transform="rotate(45 32 32)"/>
    </clipPath>
    <radialGradient id="halo" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.47" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.57" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#diamond)">
    <!-- space -->
    <rect width="64" height="64" fill="#0a0a0c"/>
    <!-- halo -->
    <circle cx="32" cy="32" r="26" fill="url(#halo)"/>
  </g>
  <!-- photon ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#ffffff" stroke-width="1.1"/>
  <!-- event horizon -->
  <circle cx="32" cy="32" r="10.5" fill="#000000"/>
</svg>
