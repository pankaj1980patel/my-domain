[package]
name = "mydomain_net"
version = "0.1.0"
edition = "2021"
description = "The shared mdcore engine, exported to Android (Kotlin) with UniFFI."

[lib]
name = "mydomain_net"
# cdylib: lib<name>.so for Android. lib: lets the uniffi-bindgen binary and
# tests link against it.
crate-type = ["cdylib", "lib"]

# Generates the Kotlin bindings from the compiled library
# (`cargo run --bin uniffi-bindgen -- generate --library ...`).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
mdcore = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
log = "0.4"
android_logger = "0.14"
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
md-testkit = { workspace = true }
