[package]
name = "my-domain"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_domain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdcore = { workspace = true, features = ["specta"] }
md-ble = { workspace = true }
# Typed commands: generates TypeScript bindings for the UI from the Rust
# commands (ADR-0003). The three crates move in lockstep (release candidates).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "0.0.13"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Native "pick a file to send" dialog (used from Rust, see `pick_file`).
tauri-plugin-dialog = "2"
# OS notifications (message, file saved, shared phone notification, ring),
# posted from Rust; see `notify.rs`. Locked at 2.4: later 2.x need tauri 2.12.
tauri-plugin-notification = "2"
# The system-wide "send what I copied to my phone" shortcut, registered
# from Rust; see `shortcut.rs`. Locked at 2.3: later 2.x need tauri 2.12.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
machine-uid = "0.5"
gethostname = "0.5"
if-addrs = "0.13"
tungstenite = "0.24"
# wayland-data-control adds native Wayland clipboard support (wlr data-control)
# so copy/paste works under Wayland sessions, not just X11/XWayland.
arboard = { version = "3", features = ["wayland-data-control"] }
# Copied pictures to and from PNG (the clipboard gives raw pixels).
png = "0.17"
# Native FCM receiver: simulates an Android/web client to obtain an FCM token
# and receive data messages over a persistent MTalk connection (no browser /
# service worker needed). Blocking (reqwest blocking), so it runs in its own
# thread alongside the Engine's blocking loops.
fcm_receiver_rs = "0.1.1"
# TLS for our own MTalk read loop (src/fcm.rs `listen`): the crate's blocks
# with no timeout, so a superseded receiver couldn't stop. Same version the
# crate already pulls in.
native-tls = "0.2"
# The session token and device key, kept in the OS secure store so a restart
# stays signed in (Linux builds need libdbus-1-dev).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# The phone as touchpad and keyboard: plays its pointer, click, scroll, text
# and key events back here (see `remote_input.rs`). On Linux the default
# backend talks to the X server (x11rb, pure Rust); macOS needs the
# Accessibility permission.
enigo = "0.6"

# Scheduled actions: the local time and weekday, time zone and DST included
# (see `schedule.rs`). Already in Cargo.lock; `time`'s local offset refuses
# to work in a multi-threaded process on Unix.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Webhooks (see `webhooks.rs`): a tiny HTTP server on 127.0.0.1 with a
# random bearer token. All three already in Cargo.lock (httparse via
# tungstenite, base64 via mdcore, getrandom via tauri): no new crates.
httparse = "1"
base64 = "0.22"
getrandom = "0.3"

# Find my computer: where this Mac is, from CoreLocation (see `location.rs`).
# Same versions Tauri already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSString", "NSValue", "NSArray"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocation", "CLLocationManager"] }
# Calls on this Mac (see `calls.rs`): the phone's call audio to and from
# this Mac's speakers and microphones (CoreAudio). Already built: rodio
# (via fcm_receiver_rs) pulls in this exact version, so no new crates.
cpal = "0.16"
